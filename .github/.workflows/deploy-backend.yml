name: Deploy Backend

on:
  push:
    tags:
      - "backend-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to deploy or roll back to (e.g., 0.1.1)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nerdos-api

jobs:
  build:
    # Build and push only when a new version tag is pushed
    if: startsWith(github.ref, 'refs/tags/backend-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and short SHA
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#backend-v}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.short_sha }}

  deploy:
    needs: build
    # Runs after a tag build OR immediately on manual rollback dispatch
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target version
        id: target
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#backend-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy immutable image to Cloud PaaS
        run: |
          TARGET_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.target.outputs.version }}"
          echo "Ready to deploy immutable image: $TARGET_IMAGE"

          # TODO: Replace with your chosen Cloud PaaS deploy command:
          # --- Google Cloud Run ---
          # gcloud run deploy nerdos-api --image "$TARGET_IMAGE" --region us-west1
          #
          # --- AWS App Runner / ECS ---
          # aws apprunner update-service --service-arn "$SERVICE_ARN" ...
          #
          # --- Azure Container Apps ---
          # az containerapp update --name nerdos-api --resource-group nerdos-rg --image "$TARGET_IMAGE"