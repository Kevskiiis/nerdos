name: Deploy Frontend

on:
  push:
    tags:
      - "frontend-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to deploy or roll back to (e.g., 1.0.1)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nerdos-frontend

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/frontend-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and short SHA
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#frontend-v}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.short_sha }}

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target version
        id: target
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#frontend-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy immutable image to Cloud PaaS
        run: |
          TARGET_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.target.outputs.version }}"
          echo "Ready to deploy immutable image: $TARGET_IMAGE"

          # TODO: Add your Cloud PaaS deployment or static CDN upload step here